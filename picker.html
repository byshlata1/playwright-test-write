<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Playwright Recorder — Save</title>
  <style>
    body { font-family: system-ui; padding: 24px; max-width: 400px; margin: 0 auto; }
    button { padding: 12px 24px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 6px; }
    button:hover { background: #1565c0; }
    #status { margin-top: 16px; color: #666; font-size: 14px; }
    #status.success { color: #2e7d32; }
    #status.error { color: #c62828; }
  </style>
</head>
<body>
  <h2>Save test and mocks</h2>
  <p>Select the folder where the test file and mocks will be saved.</p>
  <button id="btn-save">Select folder and save</button>
  <div id="status"></div>
  <script src="dist/picker.js"></script>
</body>
</html>
